<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Embrace Learning</title>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">

      <div class="login-logo">
        <img src="../images/logo.png" alt="Embrace Learning">
        <div class="login-logo-text">Embrace <span>Learning</span></div>
      </div>
      <p class="login-subtitle">Admin Portal — Sign in to continue</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="adminEmail">Email Address <span class="required">*</span></label>
          <input type="email" id="adminEmail" name="email" placeholder="admin@embracelearning.in" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="adminPassword">Password <span class="required">*</span></label>
          <input type="password" id="adminPassword" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary login-btn">Sign In</button>
      </form>

      <p class="login-footer">&copy; 2026 Embrace Learning and Development Hub</p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('adminEmail').value.trim();
      var password = document.getElementById('adminPassword').value;
      if (!email || !password) {
        alert('Please enter your email and password.');
        return;
      }
      // TODO: Replace with real auth
      window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
